services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kickback
      POSTGRES_PASSWORD: kickback
      POSTGRES_DB: kickback
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kickback -d kickback"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:

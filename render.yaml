services:
  - type: web
    name: kickback-web
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: commit
    envVars:
      - fromGroup: kickback-shared
      - key: PG_POOL_MAX
        value: "5"
      # PayPal's sandbox limits requests per IP; web, cron and workflows share 45/min.
      - key: PAYPAL_RATE_PER_MIN
        value: "28"
      - key: PUBLIC_SANDBOX_TOOLS
        value: "false"
      # Server-only password for the read-only demo account; nobody needs to know it.
      - key: DEMO_VIEWER_PASSWORD
        generateValue: true
      - key: DEMO_BUYER_CREDENTIALS_JSON
        sync: false
      - key: STATUS_PAGE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kickback-db
          property: connectionString
      - key: KICKBACK_ENV
        value: sandbox
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_ID
        sync: false
      - key: PAYPAL_BN_CODE
        sync: false
      - key: PAYPAL_CONNECTION_MODE
        value: partner
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: PAYPAL_LOGIN_ENABLED
        sync: false
      - key: TENANT_PURGE_HOURS
        value: "48"
      - key: BACKFILL_DAYS
        value: "90"
      - key: RECONCILE_INTERVAL_HOURS
        value: "6"
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: AI_MAX_ANALYST_TURNS_PER_MERCHANT_PER_DAY
        value: "80"
      - key: AI_EFFORT_ANALYST
        value: low
      - key: KICKBACK_MASTER_KEY
        generateValue: true
      - key: JOBS_BEARER
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: KICKBACK_ALLOW_UNVERIFIED_WEBHOOKS
        value: "false"
      - key: SENTRY_CSP_REPORT_URL
        sync: false
      - key: PROGRESS_LINK_TTL_DAYS
        value: "365"
      - key: RENDER_API_KEY
        sync: false
      - key: WORKFLOW_SLUG
        fromService:
          type: workflow
          name: kickback-workflows
          property: slug
  - type: cron
    name: kickback-jobs
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: npm run jobs
    autoDeployTrigger: commit
    envVars:
      - fromGroup: kickback-shared
      - key: PG_POOL_MAX
        value: "2"
      - key: PAYPAL_RATE_PER_MIN
        value: "12"
      - key: BETTERSTACK_JOBS_HEARTBEAT_URL
        sync: false
      - key: BETTERSTACK_SOAK_HEARTBEAT_URL
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: WORKFLOW_SLUG
        fromService:
          type: workflow
          name: kickback-workflows
          property: slug
  - type: workflow
    name: kickback-workflows
    runtime: node
    region: oregon
    buildCommand: npm ci
    startCommand: npx tsx workflows/index.ts
    envVars:
      - fromGroup: kickback-shared
      - key: PG_POOL_MAX
        value: "2"
      - key: PAYPAL_RATE_PER_MIN
        value: "5"
      - key: BETTERSTACK_RECONCILE_HEARTBEAT_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kickback-db
          property: connectionString
databases:
  - name: kickback-db
    databaseName: kickback
    user: kickback
    region: oregon
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "16"
    ipAllowList: []

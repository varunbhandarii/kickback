services:
  - type: web
    name: kickback-web
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kickback-db
          property: connectionString
      - key: KICKBACK_ENV
        value: sandbox
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_ID
        sync: false
      - key: PAYPAL_BN_CODE
        sync: false
      - key: PAYPAL_CONNECTION_MODE
        value: partner
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: KICKBACK_MASTER_KEY
        generateValue: true
      - key: JOBS_BEARER
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: KICKBACK_ALLOW_UNVERIFIED_WEBHOOKS
        value: "false"
  - type: cron
    name: kickback-jobs
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    schedule: "*/15 * * * *"
    buildCommand: npm ci
    startCommand: npm run jobs
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kickback-db
          property: connectionString
databases:
  - name: kickback-db
    databaseName: kickback
    user: kickback
    region: oregon
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "16"
    ipAllowList: []
